# Builds cross-platform binaries and uploads to GitHub Releases.
# Binaries are discoverable by cargo-binstall (https://github.com/cargo-bins/cargo-binstall).
# Triggered automatically when release-plz publishes a release.
name: Build Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'jlizen' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p ci-battery-pack-test

      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Strip package name prefix (e.g. "my-crate-v0.1.0" -> "v0.1.0")
          VERSION="${TAG##*-v}"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ci-battery-pack-test-${{ matrix.target }}-${{ steps.version.outputs.version }}.tar.gz ci-battery-pack-test

      - name: Package (Windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ci-battery-pack-test.exe -DestinationPath ../../../ci-battery-pack-test-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ci-battery-pack-test-${{ matrix.target }}-${{ steps.version.outputs.version }}.${{ matrix.archive }}