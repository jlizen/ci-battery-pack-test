
# https://nexte.st/ (--stress-duration)
name: Stress Test

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Stress test duration in minutes"
        default: "60"

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: stable
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cf525cb33f51aca27cd6fa02034117ab963ff9f1 # v2.75.22
        with:
          tool: nextest
      - run: cargo nextest run --all-features --stress-duration '${{ inputs.duration_minutes || '60' }}m'